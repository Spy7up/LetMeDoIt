#############################################################################################################
#  sa-app 小程序端独有配置，通用配置见 sa-base 项目中的 sa-base.yaml
#  本文件可覆盖 sa-base.yaml 中的配置（实现类：YamlProcessor）
#############################################################################################################

project:
  name: sa-app
  log-directory: ${localPath:/home}/logs/smart_admin_v3/${project.name}/${spring.profiles.active}

server:
  port: 1025
  servlet:
    context-path: /

spring:
  profiles:
    active: '@profiles.active@'

# 微信小程序
wx:
  miniapp:
    # 本地开发未申请小程序时可开启 mock，用假 openid 跑通登录链路
    mock: false
    appid: ${WX_MINIAPP_APPID:wxaa5051e002ac4fba}
    secret: ${WX_MINIAPP_SECRET:fa148ae3c1d55f936e347fd7a393fe60}
    timeout: 5000
    # 订阅消息跳转版本：developer / trial / formal
    miniprogram-state: developer
    # 订阅消息模板白名单，为空表示不限制（联调方便）
    subscribe-template-ids: []
