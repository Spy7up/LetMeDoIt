<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF8A5F"/>
      <stop offset="52%" stop-color="#FF6B4A"/>
      <stop offset="100%" stop-color="#EE4E28"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.16" cy="0.08" r="0.8">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="58%" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- 一句话（气泡）→ 做完了（对勾） -->
  <g fill="#FFFFFF">
    <!-- 气泡尾巴：两点落在气泡边界上，向下收尖，描边圆角避免出现锐角 -->
    <path d="M306 656 L432 700 L300 806 Z" fill="#FFFFFF" stroke="#FFFFFF"
          stroke-width="28" stroke-linejoin="round"/>
    <rect x="232" y="232" width="560" height="470" rx="152"/>
    <path d="M402 468 L484 552 L634 390"
          fill="none" stroke="#F4572F" stroke-width="88"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
